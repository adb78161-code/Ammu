plugins { id 'com.android.application' }

android {
    namespace 'com.ammu.assistant'
    compileSdk 35
    androidResources {
        noCompress 'gguf'
    }
    aaptOptions {
        noCompress 'gguf'
    }
    defaultConfig {
        applicationId 'com.ammu.assistant'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '1.4'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_PLATFORM=android-26', '-DANDROID_ARM_NEON=ON', '-DLLAMA_BUILD_TESTS=OFF', '-DLLAMA_BUILD_EXAMPLES=OFF', '-DLLAMA_BUILD_SERVER=OFF', '-DLLAMA_BUILD_COMMON=ON', '-DGGML_NATIVE=OFF'
            }
        }
    }

    ndkVersion '27.2.12479018'

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // Never commit a signing key or credentials. The official workflow supplies these
    // environment variables from GitHub Actions secrets at build time.
    signingConfigs {
        release {
            def keystorePath = System.getenv('AMMU_KEYSTORE_PATH')
            def storePasswordEnv = System.getenv('AMMU_KEYSTORE_PASSWORD')
            def aliasEnv = System.getenv('AMMU_KEY_ALIAS')
            def keyPasswordEnv = System.getenv('AMMU_KEY_PASSWORD')
            if (keystorePath && storePasswordEnv && aliasEnv && keyPasswordEnv) {
                storeFile file(keystorePath)
                storePassword storePasswordEnv
                keyAlias aliasEnv
                keyPassword keyPasswordEnv
            }
        }
    }

    buildTypes {
        debug {
            // CI/debug APKs are for validation only, not the official distribution artifact.
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

// Fail closed if someone requests an official release build without a complete
// signing setup; Gradle must not silently produce an unsigned release APK.
def requestedRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains('assemblerelease') || it.toLowerCase().contains('bundlerelease') }
def signingReady = ['AMMU_KEYSTORE_PATH','AMMU_KEYSTORE_PASSWORD','AMMU_KEY_ALIAS','AMMU_KEY_PASSWORD'].every { name ->
    def value = System.getenv(name)
    value != null && !value.trim().isEmpty()
}
if (requestedRelease && !signingReady) {
    throw new GradleException('Official Ammu 1.4 release requires AMMU_KEYSTORE_PATH, AMMU_KEYSTORE_PASSWORD, AMMU_KEY_ALIAS and AMMU_KEY_PASSWORD. See RELEASE_SIGNING_GUIDE.md.')
}
