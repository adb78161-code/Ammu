<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Ammu - Offline AI Assistant</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #111827; color: #f9fafb; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 2rem; box-sizing: border-box; text-align: center; }
    .card { max-width: 42rem; }
    img { width: min(16rem, 70vw); height: auto; border-radius: 22%; }
    h1 { font-size: clamp(2.5rem, 8vw, 5rem); margin: 1rem 0 .5rem; }
    p { font-size: 1.1rem; line-height: 1.7; color: #d1d5db; }
    a { display: inline-block; margin-top: 1rem; padding: .8rem 1.2rem; border-radius: .7rem; background: #2563eb; color: white; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img src="assets/ammu-logo.png" alt="Ammu logo">
      <h1>Ammu</h1>
      <p>Your private, offline AI assistant for Android. Ammu keeps conversations, memory, and learning on your device.</p>
      <a href="https://github.com/adb78161-code/Ammu" target="_blank" rel="noopener noreferrer">View the Ammu project</a>
    </div>
  </main>
</body>
</html>
